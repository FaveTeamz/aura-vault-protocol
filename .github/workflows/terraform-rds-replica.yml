# .github/workflows/terraform-rds-replica.yml
#
# Validates and plans the rds-replica Terraform module and both environment
# configs (staging / production) on every PR that touches terraform/.
#
# Closes #949

name: Terraform — RDS Replica Module

on:
  push:
    branches: [main]
    paths:
      - "terraform/modules/rds-replica/**"
      - "terraform/envs/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/modules/rds-replica/**"
      - "terraform/envs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Validate module and environment configs ─────────────────────────────
  validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/modules/rds-replica
          - terraform/envs/staging
          - terraform/envs/production

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: terraform -chdir=${{ matrix.dir }} fmt -check -recursive

      - name: Terraform Init (local backend — no AWS creds required)
        run: terraform -chdir=${{ matrix.dir }} init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.dir }} validate

  # ── Plan environment configs (needs AWS creds) ──────────────────────────
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_CI_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: tf-rds-replica-plan-${{ matrix.env }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        run: |
          terraform -chdir=terraform/envs/${{ matrix.env }} init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=aura-vault-terraform-locks" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=terraform/envs/${{ matrix.env }} plan \
            -out=tfplan \
            -input=false \
            -no-color 2>&1 | tee plan-output.txt

      - name: Post plan summary to PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n…(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan: \`envs/${{ matrix.env }}\`\n\`\`\`\n${truncated}\n\`\`\``
            });
