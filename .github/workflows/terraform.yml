# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/terraform.yml
#
# Runs Terraform plan/apply using OIDC (no long-lived AWS keys).
# The IAM role is created by terraform/remote-state/ and its ARN is stored as
# a GitHub Actions secret: TF_CI_ROLE_ARN
# ─────────────────────────────────────────────────────────────────────────────
name: Terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging | production)"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false  # never cancel in-flight Terraform runs

jobs:
  # ── Validate every changed module ──────────────────────────────────────────
  validate:
    name: Validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - remote-state
          - staging
          - production

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        run: terraform -chdir=terraform/${{ matrix.module }} fmt -check -recursive

      - name: Terraform Init (local backend for validation)
        run: terraform -chdir=terraform/${{ matrix.module }} init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/${{ matrix.module }} validate

  # ── Plan ───────────────────────────────────────────────────────────────────
  plan:
    name: Plan (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: validate
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        module:
          - staging
          - production

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_CI_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terraform-plan-${{ matrix.module }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        run: |
          terraform -chdir=terraform/${{ matrix.module }} init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.module }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=aura-vault-terraform-locks" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=terraform/${{ matrix.module }} plan \
            -var="environment=${{ matrix.module }}" \
            -out=tfplan \
            -input=false \
            -no-color 2>&1 | tee plan-output.txt

      - name: Post plan summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n…(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan: \`${{ matrix.module }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.module }}-${{ github.run_id }}
          path: terraform/${{ matrix.module }}/tfplan
          retention-days: 7

  # ── Apply staging (auto on merge to main) ──────────────────────────────────
  apply-staging:
    name: Apply (staging)
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_CI_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terraform-apply-staging-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: terraform/staging/

      - name: Terraform Init
        run: |
          terraform -chdir=terraform/staging init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=aura-vault-terraform-locks" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Apply
        run: terraform -chdir=terraform/staging apply -input=false tfplan

  # ── Apply production (manual approval gate) ────────────────────────────────
  apply-production:
    name: Apply (production)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production   # requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TF_CI_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terraform-apply-production-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-production-${{ github.run_id }}
          path: terraform/production/

      - name: Terraform Init
        run: |
          terraform -chdir=terraform/production init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=aura-vault-terraform-locks" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Apply
        run: terraform -chdir=terraform/production apply -input=false tfplan
