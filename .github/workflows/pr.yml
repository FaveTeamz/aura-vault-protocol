name: PR Checks

on:
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aura-vault/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aura-vault/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path aura-vault/Cargo.toml -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path aura-vault/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aura-vault/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aura-vault/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --manifest-path aura-vault/Cargo.toml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit --manifest-path aura-vault/Cargo.toml

  build:
    name: Build Wasm
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            aura-vault/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('aura-vault/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Wasm
        run: cargo build --manifest-path aura-vault/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Check Wasm size
        run: |
          WASM=aura-vault/target/wasm32-unknown-unknown/release/aura_vault.wasm
          SIZE=$(wc -c < "$WASM")
          echo "Wasm size: ${SIZE} bytes"
          # Soroban max contract size is 65536 bytes (64 KiB)
          if [ "$SIZE" -gt 65536 ]; then
            echo "ERROR: Wasm binary exceeds 64 KiB Soroban limit"
            exit 1
          fi

      - name: Upload Wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: aura-vault-wasm-pr-${{ github.event.number }}
          path: aura-vault/target/wasm32-unknown-unknown/release/aura_vault.wasm
          retention-days: 7

  deposit-flow-e2e:
    name: Deposit Flow E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chrome, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start frontend server
        working-directory: frontend
        run: npx next start -p 3000 &
        env:
          NODE_ENV: production

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright deposit flow tests (Chrome, Firefox, WebKit)
        run: |
          npx playwright test playwright/deposit-flow.spec.ts \
            --project=chromium \
            --project=firefox \
            --project=webkit
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-deposit-report-pr-${{ github.event.number }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure-screenshots-pr-${{ github.event.number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

