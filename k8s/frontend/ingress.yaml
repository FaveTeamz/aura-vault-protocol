# =============================================================================
# Ingress — Frontend (app.aura-vault.xyz) with cert-manager TLS
#
# cert-manager reads the annotation cert-manager.io/cluster-issuer and
# automatically provisions and renews the certificate named in tls[].secretName.
#
# Prerequisites:
#   1. cert-manager installed in the cert-manager namespace
#   2. ClusterIssuer letsencrypt-prod applied (k8s/cert-manager/clusterissuer.yaml)
#   3. Certificate resource applied (k8s/cert-manager/certificates.yaml)
#   4. nginx-ingress controller running with an external IP
#
# Closes #951
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: aura-vault
  labels:
    app: frontend
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: ingress
  annotations:
    # Tell cert-manager which ClusterIssuer to use for this Ingress.
    # Switching to letsencrypt-staging first is recommended for testing.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # nginx-specific: enable SSL redirect and set HSTS header
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"

    # Proxy settings for Next.js
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    # secretName must match Certificate.spec.secretName in certificates.yaml
    - hosts:
        - app.aura-vault.xyz
        - www.aura-vault.xyz
      secretName: frontend-tls
  rules:
    - host: app.aura-vault.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: www.aura-vault.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
